# LiteLLM-Proxy fuer beide Hausuebungen.
#   Part 1: LLM-Gateway fuer den ReAct-Client (Alias gpt-4o-mini)
#   Part 2: zusaetzlich Agent-Registry und A2A-Gateway (braucht Postgres)
#
# Schluessel stehen nie hier, sondern in litellm/.env (siehe .env.example).
# Start: .\litellm\start_proxy.ps1

model_list:
  # Alias, den die Clients ansprechen. Welches Modell dahinter steckt, ist
  # reine Konfiguration - das ist der Zweck des Gateways.
  - model_name: gpt-4o-mini
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  # Part 2: jeder Agent auf einem eigenen Modell (Free Tier: 20 Requests/Tag pro Modell)
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  # Nicht unterstuetzte Parameter (z.B. temperature bei Reasoning-Modellen)
  # still entfernen statt mit HTTP 400 abzubrechen.
  drop_params: true

general_settings:
  # Part 2: A2A-Agenten auf localhost freigeben. LiteLLM blockt private
  # Adressen als SSRF-Schutz, ausser sie stehen hier.
  user_url_allowed_hosts:
    - "localhost:8101"
    - "localhost:8102"
    - "localhost:8103"
